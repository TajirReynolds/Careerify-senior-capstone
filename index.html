<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisaJob Connect</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <!-- Login Form -->
    <div class="form-box active" id="login-form">
        <form onsubmit="handleLogin(event)">
            <h2>Login</h2>

            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password" required>

            <button type="submit">Login</button>

            <p>Don't have an account? 
                <a href="#" onclick="showForm('register-form'); return false;">Register</a>
            </p>
        </form>
    </div>

    <!-- Register Form -->
    <div class="form-box" id="register-form">
        <form enctype="multipart/form-data" onsubmit="handleRegister(event)">
            <h2>Register</h2>

            <input type="text" name="fullname" placeholder="Full Name" required>
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password" required>

            <select id="role" name="role" onchange="toggleResumeUpload()" required>
                <option value="">--Select Role--</option>
                <option value="student">International Student</option>
                <option value="employer">Employer</option>
                <option value="employee">Employee</option>
            </select>

            <div id="resume-section" style="display:none; margin-top:10px;">
                <label>Upload Resume:</label><br><br>
                <input type="file" name="resume" accept=".pdf,.doc,.docx">
            </div>

            <button type="submit">Register</button>

            <p>Already have an account? 
                <a href="#" onclick="showForm('login-form'); return false;">Login</a>
            </p>
        </form>
    </div>

    <!-- Profile Page -->
    <div class="form-box" id="profile-page">
        <div class="profile-card">
            <h2>User Profile</h2>

            <p><strong>Name:</strong> <span id="profile-name">N/A</span></p>
            <p><strong>Email:</strong> <span id="profile-email">N/A</span></p>
            <p><strong>Role:</strong> <span id="profile-role">N/A</span></p>

            <button onclick="goToDashboard()">Continue</button>
            <button onclick="showForm('login-form')">Logout</button>
        </div>
    </div>

    <!-- Job Post Form -->
    <div class="form-box" id="job-post-form">
        <form onsubmit="handleJobPost(event)">
            <h2>Post a Job</h2>

            <input type="text" name="job_title" placeholder="Job Title" required>
            <input type="text" name="salary" placeholder="Salary" required>
            <input type="text" name="location" placeholder="Location" required>

            <label>Remote?</label>
            <select name="remote" required>
                <option value="">--Select--</option>
                <option value="yes">Yes</option>
                <option value="no">No</option>
            </select>

            <label>Degree:</label>
            <select name="degree" required>
                <option value="">--Select--</option>
                <option value="none">None</option>
                <option value="bachelor">Bachelor's</option>
                <option value="master">Master's</option>
                <option value="phd">PhD</option>
            </select>

            <label>Date Posted:</label>
            <input type="date" name="date_posted" required>

            <button type="submit">Post Job</button>

            <p>
                <a href="#" onclick="showForm('profile-page'); return false;">Back to Profile</a>
            </p>
        </form>
    </div>

    <!-- Job Listings -->
    <div class="form-box" id="job-listings">
        <h2>Job Listings</h2>
        <div id="jobList"></div>

        <p>
            <a href="#" onclick="showForm('job-post-form'); return false;">Post Another Job</a>
        </p>

        <p>
            <a href="#" onclick="showForm('profile-page'); return false;">Back to Profile</a>
        </p>
    </div>

</div>

<script>

// ================= FORM SWITCHER =================
function showForm(formId) {
    document.querySelectorAll(".form-box").forEach(form => {
        form.classList.remove("active");
    });

    const formToShow = document.getElementById(formId);

    if (formToShow) {
        formToShow.classList.add("active");
    }
}

// ================= PROFILE SYSTEM =================
function loadProfile(){
    const user = JSON.parse(localStorage.getItem("user"));

    if(user){
        document.getElementById("profile-name").textContent = user.name;
        document.getElementById("profile-email").textContent = user.email;
        document.getElementById("profile-role").textContent = user.role;
    }
}

function handleLogin(event){
    event.preventDefault();
    loadProfile();
    showForm("profile-page");
}

function handleRegister(event){
    event.preventDefault();

    const form = event.target;

    const user = {
        name: form.fullname.value,
        email: form.email.value,
        role: document.getElementById("role").value
    };

    localStorage.setItem("user", JSON.stringify(user));

    loadProfile();
    showForm("profile-page");
}

function goToDashboard(){
    const user = JSON.parse(localStorage.getItem("user"));

    if(user.role === "employer"){
        showForm("job-post-form");
    } else {
        showForm("job-listings");
    }
}

// ================= RESUME TOGGLE =================
function toggleResumeUpload(){
   const role = document.getElementById("role").value;
   const resumeSection = document.getElementById("resume-section");

   resumeSection.style.display = (role === "employee") ? "block" : "none";
}

// ================= JOB SYSTEM =================
let jobs = [];

function handleJobPost(event){
    event.preventDefault();

    const form = event.target;

    const job = {
        title: form.job_title.value,
        salary: form.salary.value,
        location: form.location.value,
        remote: form.remote.value,
        degree: form.degree.value,
        date: form.date_posted.value
    };

    jobs.push(job);
    renderJobs();
    form.reset();

    showForm("job-listings");
}

function renderJobs(){
    const jobList = document.getElementById("jobList");
    jobList.innerHTML = "";

    jobs.forEach(job => {
        const div = document.createElement("div");
        div.classList.add("job");

        div.innerHTML = `
            <h3>${job.title}</h3>
            <p><strong>Salary:</strong> ${job.salary}</p>
            <p><strong>Location:</strong> ${job.location}</p>
            <p><strong>Remote:</strong> ${job.remote}</p>
            <p><strong>Degree:</strong> ${job.degree}</p>
            <p><strong>Posted:</strong> ${job.date}</p>
        `;

        jobList.appendChild(div);
    });
}

</script>

</body>
</html>
