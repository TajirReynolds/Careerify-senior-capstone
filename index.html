<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisaJob Connect</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- CSS File -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <!-- Login Form -->
    <div class="form-box active" id="login-form">
        <form>
            <h2>Login</h2>

            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password" required>

            <button type="submit">Login</button>

            <p>Don't have an account? 
                <a href="#" onclick="showForm('register-form'); return false;">Register</a>
            </p>
        </form>
    </div>

    <!-- Register Form -->
    <div class="form-box" id="register-form">
        <form enctype="multipart/form-data" onsubmit="handleRegister(event)">
            <h2>Register</h2>

            <input type="text" name="fullname" placeholder="Full Name" required>
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password" required>

            <select id="role" name="role" onchange="toggleResumeUpload()" required>
                <option value="">--Select Role--</option>
                <option value="student">International Student</option>
                <option value="employer">Employer</option>
                <option value="employee">Employee</option>
            </select>

            <!-- Resume Upload -->
            <div id="resume-section" style="display:none; margin-top:10px;">
                <label>Upload Resume:</label><br><br>
                <input type="file" name="resume" accept=".pdf,.doc,.docx">
            </div>

            <button type="submit">Register</button>

            <p>Already have an account? 
                <a href="#" onclick="showForm('login-form'); return false;">Login</a>
            </p>
        </form>
    </div>

    <!-- Job Post Form -->
    <div class="form-box" id="job-post-form">
        <div class="form-box" id="job-listings">
    <h2>Job Listings</h2>
    <div id="jobList"></div>

    <p>
        <a href="#" onclick="showForm('job-post-form'); return false;">
            Post Another Job
        </a>
    </p>
</div>
        <form>
            <h2>Post a Job</h2>

            <input type="text" name="job_title" placeholder="Job Title" required>
            <input type="text" name="salary" placeholder="Salary (e.g., $60,000/year)" required>
            <input type="text" name="location" placeholder="Job Location (City, Country)" required>

            <label>Is this job remote?</label>
            <select name="remote" required>
                <option value="">--Select--</option>
                <option value="yes">Yes</option>
                <option value="no">No</option>
            </select>

            <label>Degree Requirement:</label>
            <select name="degree" required>
                <option value="">--Select--</option>
                <option value="none">None</option>
                <option value="bachelor">Bachelor's</option>
                <option value="master">Master's</option>
                <option value="phd">PhD</option>
            </select>

            <label>Date Posted:</label>
            <input type="date" name="date_posted" required>

            <button type="submit">Post Job</button>

            <p>
                <a href="#" onclick="showForm('login-form'); return false;">Logout</a>
            </p>
        </form>
    </div>

</div>

<script>

// ================= FORM SWITCHER =================
function showForm(formId) {
    document.querySelectorAll(".form-box").forEach(function(form) {
        form.classList.remove("active");
    });

    const formToShow = document.getElementById(formId);

    if (formToShow) {
        formToShow.classList.add("active");
    } else {
        console.warn(`No form found with ID: ${formId}`);
    }
}

// ================= RESUME TOGGLE =================
function toggleResumeUpload(){
   const role = document.getElementById("role").value;
   const resumeSection = document.getElementById("resume-section");

   if(role === "employee"){
        resumeSection.style.display = "block";
   } else {
        resumeSection.style.display = "none";
   }
}

// ================= REGISTER LOGIC =================
function handleRegister(event){
    event.preventDefault();

    const role = document.getElementById("role").value;

    if(role === "employer"){
        showForm("job-post-form");
    } else {
        showForm("login-form");
    }
}

// ================= JOB SYSTEM =================
let jobs = [];

function handleJobPost(event){
    event.preventDefault();

    const form = event.target;

    const job = {
        title: form.job_title.value,
        salary: form.salary.value,
        location: form.location.value,
        remote: form.remote.value,
        degree: form.degree.value,
        date: form.date_posted.value
    };

    jobs.push(job);

    renderJobs();

    form.reset();

    showForm("job-listings");
}

function renderJobs(){
    const jobList = document.getElementById("jobList");

    if (!jobList) {
        console.warn("jobList container not found");
        return;
    }

    jobList.innerHTML = "";

    jobs.forEach(job => {
        const div = document.createElement("div");
        div.classList.add("job");

        div.innerHTML = `
            <h3>${job.title}</h3>
            <p><strong>Salary:</strong> ${job.salary}</p>
            <p><strong>Location:</strong> ${job.location}</p>
            <p><strong>Remote:</strong> ${job.remote}</p>
            <p><strong>Degree:</strong> ${job.degree}</p>
            <p><strong>Posted:</strong> ${job.date}</p>
        `;

        jobList.appendChild(div);
    });
}

</script>

</body>
</html>
